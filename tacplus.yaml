kind: library
# Compiler floor: the looper builds with this MAJOR.MINOR's latest patch (tacplus#161).
tacplus: "2.6"
language: go
# pkg is derived from go.mod (github.com/tacplus-dev/operator: the org name has a hyphen,
# which pkg cannot carry). A derived Go package is <module>/tacplus, so the output is "tacplus".
output-dir: .
output-name: tacplus
src: proto
# operator composes other services' config, so its proto imports theirs; they come
# through depends (registry names), not by copying their protos here. kernel's
# contract owns common/credentials.proto (CredPair). The rest are what
# pkg/bootstrap still names directly (gateway TLS mode, eventbus node role,
# example config); that composition is fleet knowledge
# and moves to the fleet layer, at which point these entries go with it.
# states: all — the operator composes every service's config (the kernel seed,
# each service's typed Config from services/<name>.yaml), so it generates from
# every service's config and state, as kernel does; depends alone would scope
# the services holder to the entries listed below.
states: all
depends:
  - kernel
  - oauth
  - gateway
  - eventbus
  - opa
  # stratum: its Config in the holder, and its StratumTenantConfig (the
  # per-tenant seed_members #2 delivers). It used to arrive only through
  # letsencrypt's depends, retired here (#21).
  - stratum
  # redo, the durability of every tenant's Stratum: its registry entry
  # (tenant_owned, pinned_tenant: restore) and its Config in the holder.
  - redo
  # pkg/bootstrap tests exercise the app-service config path with llmproxy.
  - llmproxy
