kind: service
language: go
# pkg kept as copied so the hand-written code keeps compiling; moves with the packages later.
pkg: com.gitlab.seabeam.schematic.platform.services.operator
output-dir: .
src: proto
# operator composes other services' config, so its proto imports theirs; they come
# through depends (registry names), not by copying their protos here.
depends:
  - oauth
  - kmaker
