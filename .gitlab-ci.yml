# ---------------------------------------------------------------------------
# Package: docker push (linux/arm64 only).
# ---------------------------------------------------------------------------
package-release:
  stage: package
  retry: 2
  image: docker:latest
  tags:
    - schematic-aarch64
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  needs: [build-linux-arm64]
  before_script:
    - unset DOCKER_AUTH_CONFIG
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      BASE="${CI_REGISTRY_IMAGE}/schematic-operator"
      cp schematic-operator-linux-arm64 schematic-operator
      docker build \
        --platform linux/arm64 \
        -f Dockerfile \
        -t "${BASE}:${CI_COMMIT_TAG}" \
        .
      docker push "${BASE}:${CI_COMMIT_TAG}"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[a-zA-Z][a-zA-Z0-9_-]*\.\d+)?$/

# ---------------------------------------------------------------------------
# Chart: package and push the operator Helm chart to the GitLab registry.
# ---------------------------------------------------------------------------
chart:
  stage: chart
  retry: 2
  image:
    name: alpine/helm:latest
    entrypoint: [""]
  needs: [package-release]
  script:
    - |
      V="${CI_COMMIT_TAG#v}"
      sed -i "s/^version:.*/version: ${V}/" helm/Chart.yaml
      sed -i "s/^appVersion:.*/appVersion: \"${CI_COMMIT_TAG}\"/" helm/Chart.yaml
      sed -i "s|schematic-operator:.*|schematic-operator:${CI_COMMIT_TAG}|" helm/values.yaml
      helm package helm/ --destination .
      helm registry login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      helm push schematic-operator-${V}.tgz oci://${CI_REGISTRY_IMAGE}/charts
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[a-zA-Z][a-zA-Z0-9_-]*\.\d+)?$/

# ---------------------------------------------------------------------------
# Release: upload binaries to the GitLab generic package registry and
# create a GitLab Release with download links.
# ---------------------------------------------------------------------------
release:
  stage: release
  retry: 2
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [build-linux-arm64, build-linux-amd64, build-darwin-arm64]
  before_script:
    - apk add --no-cache curl
  script:
    - |
      BASE="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/schematic-operator/${CI_COMMIT_TAG}"
      for FILE in \
        schematic-operator-linux-arm64 \
        schematic-operator-linux-amd64 \
        schematic-operator-darwin-arm64; do
        echo "Uploading ${FILE}..."
        curl --fail --silent --show-error --http1.1 \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$FILE" \
          "${BASE}/${FILE}"
      done
  release:
    tag_name: $CI_COMMIT_TAG
    description: "schematic-operator $CI_COMMIT_TAG"
    assets:
      links:
        - name: "schematic-operator-linux-arm64"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/schematic-operator/${CI_COMMIT_TAG}/schematic-operator-linux-arm64"
          link_type: package
        - name: "schematic-operator-linux-amd64"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/schematic-operator/${CI_COMMIT_TAG}/schematic-operator-linux-amd64"
          link_type: package
        - name: "schematic-operator-darwin-arm64 (macOS Apple Silicon)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/schematic-operator/${CI_COMMIT_TAG}/schematic-operator-darwin-arm64"
          link_type: package
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[a-zA-Z][a-zA-Z0-9_-]*\.\d+)?$/
