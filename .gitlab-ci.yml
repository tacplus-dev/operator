# cavalier/operator — standalone CI
#
# Triggered on:
#   - version tags: v<major>.<minor>.<patch>-dev.<patch> or v<major>.<minor>.<patch>
#     e.g. v1.2.36-dev.36 (dev, fan-out from proto) or v1.2.36 (prod release)
#     The trailing .<patch> in dev tags always equals the patch, e.g. v1.2.36-dev.36.
#   - PROTO_VALIDATE=true (fan-out from cavalier/proto on every proto tag)
#     → runs proto-validate job to confirm operator still compiles with new proto
#
# Stages on version tag:
#   .pre    — compute tacplus image tag
#   build   — cross-compile binaries (parallel)
#   package — docker buildx multi-arch push
#   chart   — push Helm chart to GitLab registry
#   release — upload binaries + create GitLab Release
#
# Stage on PROTO_VALIDATE=true:
#   .pre    — compute tacplus image tag (from PROTO_VERSION)
#   build   — validate: tacplus build + go build ./...

stages:
  - build
  - package
  - chart
  - release

# ---------------------------------------------------------------------------
# Compute the tacplus image tag from the version tag.
# On proto fan-out, derives from PROTO_VERSION instead of CI_COMMIT_TAG.
# ---------------------------------------------------------------------------
compute-image:
  stage: .pre
  image: alpine:latest
  script:
    - |
      TAG="${CI_COMMIT_TAG:-${PROTO_VERSION}}"
      V="${TAG#v}"
      DOTPART="${V%%-*}"
      MAJOR="$(echo "$DOTPART" | cut -d. -f1)"
      MINOR="$(echo "$DOTPART" | cut -d. -f2)"
      echo "TACPLUS_IMAGE=${CI_REGISTRY}/secondstarcavalier/schematic/tacplus/tacplus-${MAJOR}-${MINOR}:latest" > ci.env
      cat ci.env
  artifacts:
    reports:
      dotenv: ci.env
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-dev\.\d+)?$/
    - if: $PROTO_VALIDATE == "true"

# ---------------------------------------------------------------------------
# Proto-validate: triggered by cavalier/proto fan-out.
# Clones proto at PROTO_VERSION, runs tacplus codegen, compiles all packages.
# ---------------------------------------------------------------------------
proto-validate:
  stage: build
  image: $TACPLUS_IMAGE
  needs: [compute-image]
  before_script:
    - printf "machine gitlab.com\nlogin gitlab-ci-token\npassword %s\n" "$CI_JOB_TOKEN" > ~/.netrc
  script:
    - git clone --quiet https://gitlab.com/secondstarcavalier/schematic/platform/proto.git proto
    - git -C proto checkout --quiet "$PROTO_VERSION"
    - tacplus build --skip-post --src proto
    - go mod download
    - CGO_ENABLED=0 go build ./...
  rules:
    - if: $PROTO_VALIDATE == "true"

# ---------------------------------------------------------------------------
# Build: tacplus codegen + cross-compile. Three jobs run in parallel.
# ---------------------------------------------------------------------------
.build-binary:
  stage: build
  image: $TACPLUS_IMAGE
  needs: [compute-image]
  before_script:
    - printf "machine gitlab.com\nlogin gitlab-ci-token\npassword %s\n" "$CI_JOB_TOKEN" > ~/.netrc
  script:
    - git clone --quiet https://gitlab.com/secondstarcavalier/schematic/platform/proto.git proto
    # Strip the trailing .<patch> suffix from the operator tag to get the proto tag.
    # e.g. v1.2.36-dev.36 → v1.2.36-dev; v1.2.36 → v1.2.36 (no change for prod)
    - PROTO_TAG="$(echo "${CI_COMMIT_TAG}" | sed 's/-dev\.[0-9]*$/-dev/')"
    - git -C proto checkout --quiet "${PROTO_TAG}"
    - tacplus build --skip-post --src proto
    - go mod download
    - VERSION="${CI_COMMIT_TAG:-dev-${CI_COMMIT_SHORT_SHA}}"
    - PKG="gitlab.com/secondstarcavalier/schematic/platform/operator/pkg/bootstrap"
    - |
      CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
        go build -trimpath -ldflags="-s -w -X ${PKG}.Version=${VERSION}" \
        -o "cavalier-operator-${GOOS}-${GOARCH}" \
        ./cmd/cavalier-operator
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-dev\.\d+)?$/

build-linux-arm64:
  extends: .build-binary
  variables:
    GOOS: linux
    GOARCH: arm64
  artifacts:
    paths:
      - cavalier-operator-linux-arm64
    expire_in: 1 hour

build-darwin-arm64:
  extends: .build-binary
  variables:
    GOOS: darwin
    GOARCH: arm64
  artifacts:
    paths:
      - cavalier-operator-darwin-arm64
    expire_in: 1 hour

# ---------------------------------------------------------------------------
# Package: docker push (linux/arm64 only).
# ---------------------------------------------------------------------------
package-release:
  stage: package
  image: docker:latest
  services:
    - docker:dind
  needs: [build-linux-arm64]
  before_script:
    - unset DOCKER_AUTH_CONFIG
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      BASE="${CI_REGISTRY_IMAGE}/cavalier-operator"
      cp cavalier-operator-linux-arm64 cavalier-operator
      docker build \
        -f Dockerfile \
        -t "${BASE}:${CI_COMMIT_TAG}" \
        .
      docker push "${BASE}:${CI_COMMIT_TAG}"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-dev\.\d+)?$/

# ---------------------------------------------------------------------------
# Chart: package and push the operator Helm chart to the GitLab registry.
# ---------------------------------------------------------------------------
chart:
  stage: chart
  image:
    name: alpine/helm:latest
    entrypoint: [""]
  needs: [package-release]
  script:
    - |
      V="${CI_COMMIT_TAG#v}"
      sed -i "s/^version:.*/version: ${V}/" helm/Chart.yaml
      sed -i "s/^appVersion:.*/appVersion: \"${CI_COMMIT_TAG}\"/" helm/Chart.yaml
      sed -i "s|cavalier-operator:.*|cavalier-operator:${CI_COMMIT_TAG}|" helm/values.yaml
      helm package helm/ --destination .
      helm registry login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      helm push cavalier-operator-${V}.tgz oci://${CI_REGISTRY_IMAGE}/charts
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-dev\.\d+)?$/

# ---------------------------------------------------------------------------
# Release: upload binaries to the GitLab generic package registry and
# create a GitLab Release with download links.
# ---------------------------------------------------------------------------
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [build-linux-arm64, build-darwin-arm64]
  before_script:
    - apk add --no-cache curl
  script:
    - |
      BASE="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cavalier-operator/${CI_COMMIT_TAG}"
      for FILE in \
        cavalier-operator-linux-arm64 \
        cavalier-operator-darwin-arm64; do
        echo "Uploading ${FILE}..."
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$FILE" \
          "${BASE}/${FILE}"
      done
  release:
    tag_name: $CI_COMMIT_TAG
    description: "cavalier-operator $CI_COMMIT_TAG"
    assets:
      links:
        - name: "cavalier-operator-linux-arm64"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cavalier-operator/${CI_COMMIT_TAG}/cavalier-operator-linux-arm64"
          link_type: package
        - name: "cavalier-operator-darwin-arm64 (macOS Apple Silicon)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cavalier-operator/${CI_COMMIT_TAG}/cavalier-operator-darwin-arm64"
          link_type: package
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-dev\.\d+)?$/
