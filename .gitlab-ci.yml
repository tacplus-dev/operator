# schematic/services/operator — standalone CI
#
# Triggered on:
#   - version tags: v<major>.<minor>.<patch>-main.<local> or v<major>.<minor>.<patch>
#     e.g. v1.2.36-main.1 (prerelease, fan-out from proto) or v1.2.36 (prod)
#     Proto tag is v1.2.36-main.36 (suffix = patch); operator/services start at .1.
#   - PROTO_VALIDATE=true (fan-out from schematic/proto on every proto tag)
#     → runs proto-validate job to confirm operator still compiles with new proto
#
# Stages on version tag:
#   .pre    — compute tacplus image tag
#   build   — cross-compile binaries (parallel)
#   package — docker buildx multi-arch push
#   chart   — push Helm chart to GitLab registry
#   release — upload binaries + create GitLab Release
#
# Stage on PROTO_VALIDATE=true:
#   .pre    — compute tacplus image tag (from PROTO_VERSION)
#   build   — validate: tacplus build + go build ./... + generated-output gate

stages:
  - build
  - package
  - chart
  - release

# ---------------------------------------------------------------------------
# Compute the tacplus image tag from the version tag.
# On proto fan-out, derives from PROTO_VERSION instead of CI_COMMIT_TAG.
# ---------------------------------------------------------------------------
compute-image:
  stage: .pre
  image: alpine:latest
  script:
    - |
      TAG="${CI_COMMIT_TAG:-${PROTO_VERSION}}"
      V="${TAG#v}"
      DOTPART="${V%%-*}"
      MAJOR="$(echo "$DOTPART" | cut -d. -f1)"
      MINOR="$(echo "$DOTPART" | cut -d. -f2)"
      echo "TACPLUS_IMAGE=${CI_REGISTRY}/secondstarcavalier/schematic/tacplus/tacplus-${MAJOR}-${MINOR}:latest" > ci.env
      cat ci.env
  artifacts:
    reports:
      dotenv: ci.env
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[a-zA-Z][a-zA-Z0-9_-]*\.\d+)?$/
    - if: $PROTO_VALIDATE == "true"

# ---------------------------------------------------------------------------
# Proto-validate: triggered by schematic/proto fan-out.
# Clones proto at PROTO_VERSION, runs tacplus codegen, compiles all packages.
# ---------------------------------------------------------------------------
proto-validate:
  stage: build
  retry: 2
  image: $TACPLUS_IMAGE
  tags:
    - schematic-aarch64
  needs: [compute-image]
  before_script:
    - printf "machine gitlab.com\nlogin gitlab-ci-token\npassword %s\n" "$CI_JOB_TOKEN" > ~/.netrc
  script:
    - git clone --quiet https://gitlab.com/secondstarcavalier/schematic/platform/proto.git proto
    - git -C proto checkout --quiet "$PROTO_VERSION"
    - tacplus build --src proto
    - go mod download
    - CGO_ENABLED=0 go build ./...
    # Generated-output gate: every artifact `schematic-operator generate`
    # emits is a serialized proto its consumer validates at boot. Assert the
    # emitted bytes still satisfy those protos' spec.assert_* constraints, so a
    # field that became assert_required in this proto version fails here rather
    # than crash-looping a pod after deploy.
    - go test ./pkg/bootstrap/ -run 'TestGeneratedOutputSatisfiesConsumerProtos|TestGeneratedKernelConfigCarriesEveryRequiredField|TestValidateDeployConfigsNamesTheMissingField|TestEveryDeployArtifactIsClassified' -count=1
  rules:
    - if: $PROTO_VALIDATE == "true"

# ---------------------------------------------------------------------------
# Build: tacplus codegen + cross-compile. Jobs run in parallel.
# All targets use CGO_ENABLED=0 so they cross-compile from any host.
# Windows jobs are defined below but commented out.
# ---------------------------------------------------------------------------
.build-binary:
  stage: build
  retry: 2
  image: $TACPLUS_IMAGE
  needs: [compute-image]
  before_script:
    - printf "machine gitlab.com\nlogin gitlab-ci-token\npassword %s\n" "$CI_JOB_TOKEN" > ~/.netrc
  script:
    - git clone --quiet https://gitlab.com/secondstarcavalier/schematic/platform/proto.git proto
    # Resolve the proto tag for our (version, channel). A tag's channel
    # segment identifies the branch it lives on (`-main.` ⇒ proto's main
    # branch, `-demo.` ⇒ proto's demo branch, etc.) and proto's per-channel
    # counter ticks independently. We can't mechanically construct the
    # proto tag from our own — main happens to share patch numbers by
    # convention, but demo / future release channels do not. So look up
    # proto's latest tag matching the same (version, channel).
    # e.g. our v1.2.141-main.142 → proto v1.2.141-main.141
    #      our v1.2.141-demo.1   → proto v1.2.141-demo.1
    - V="${CI_COMMIT_TAG#v}"
    - VERSION="${V%%-*}"
    - REST="${V#${VERSION}-}"
    - CHANNEL="${REST%%.*}"
    - PROTO_TAG="$(git -C proto tag --list "v${VERSION}-${CHANNEL}.*" --sort=-version:refname | head -1)"
    - '[ -n "$PROTO_TAG" ] || { echo "no proto tag matching v${VERSION}-${CHANNEL}.*"; exit 1; }'
    - echo "Resolved proto tag $PROTO_TAG for our $CI_COMMIT_TAG"
    - git -C proto checkout --quiet "$PROTO_TAG"
    - tacplus build --src proto
    - go mod download
    # Generated-output gate: every artifact `schematic-operator generate`
    # emits is a serialized proto its consumer validates at boot. Assert the
    # emitted bytes still satisfy those protos' spec.assert_* constraints, so a
    # field that became assert_required in this proto version fails here rather
    # than crash-looping a pod after deploy.
    - go test ./pkg/bootstrap/ -run 'TestGeneratedOutputSatisfiesConsumerProtos|TestGeneratedKernelConfigCarriesEveryRequiredField|TestValidateDeployConfigsNamesTheMissingField|TestEveryDeployArtifactIsClassified' -count=1
    - VERSION="${CI_COMMIT_TAG:-dev-${CI_COMMIT_SHORT_SHA}}"
    - PKG="gitlab.com/secondstarcavalier/schematic/platform/services/operator/pkg/bootstrap"
    - |
      CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
        go build -trimpath -ldflags="-s -w -X ${PKG}.Version=${VERSION}" \
        -o "schematic-operator-${GOOS}-${GOARCH}${EXT:-}" \
        ./cmd/schematic-operator
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[a-zA-Z][a-zA-Z0-9_-]*\.\d+)?$/

build-linux-arm64:
  extends: .build-binary
  tags:
    - schematic-aarch64
  variables:
    GOOS: linux
    GOARCH: arm64
  artifacts:
    paths:
      - schematic-operator-linux-arm64
    expire_in: 1 hour

build-linux-amd64:
  extends: .build-binary
  tags:
    - schematic-aarch64
  variables:
    GOOS: linux
    GOARCH: amd64
  artifacts:
    paths:
      - schematic-operator-linux-amd64
    expire_in: 1 hour

build-darwin-arm64:
  extends: .build-binary
  tags:
    - schematic-aarch64
  variables:
    GOOS: darwin
    GOARCH: arm64
  artifacts:
    paths:
      - schematic-operator-darwin-arm64
    expire_in: 1 hour

