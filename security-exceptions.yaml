# The security findings operator accepts, read by the build's security checks
# (looper-scan, tacplus-dev/looper#49). Each entry needs an id, a reason, who
# decided and when it expires; an expired one fails the checks again. An entry
# matches the rule id wherever it fires, so each reason names where it applies.
exceptions:
  - id: G302
    reason: "schematic-operator upgrade makes the binary it downloads executable (pkg/bootstrap/upgrade.go os.Chmod 0755): an executable has to be 0755 (#29)"
    decided_by: "hub (Jody's delegation, 2026-11-10)"
    expires: 2027-02-10
  - id: G101
    reason: "gosec false positives in pkg/helm/generator.go: a mount path (/var/run/secrets/schematic/kernel) and a ConfigMap name (schematic-pipeline-secrets), not credentials (#29)"
    decided_by: "hub (Jody's delegation, 2026-11-10)"
    expires: 2027-02-10
  - id: G304
    reason: "the CLI reads the config directory and the files it is given on its command line, by design (#29)"
    decided_by: "hub (Jody's delegation, 2026-11-10)"
    expires: 2027-02-10
  - id: go.lang.security.audit.xss.import-text-template.import-text-template
    reason: "pkg/helm/generator.go renders YAML, not HTML: html/template's escaping would corrupt it (#29)"
    decided_by: "hub (Jody's delegation, 2026-11-10)"
    expires: 2027-02-10
  - id: DS-0026
    reason: "Dockerfile and Dockerfile.multiarch: the distroless static:nonroot base has no shell for a HEALTHCHECK, and Kubernetes ignores the instruction and runs the pod's probes instead (#41)"
    decided_by: "hub (Jody, 2026-11-17, #41)"
    expires: 2027-05-17
  - id: KSV-0056
    reason: "helm/templates/role.yaml, the schematic-operator Role of the one-namespace layout (operator.deployment unset): the rights the operator needs to apply the generated fleet chart, here its services and networkpolicies rules; networkpolicies is kernel's kernel-raft NetworkPolicy (#20, #24, #30), until kernel's Raft and Hazelcast member ports are authenticated (tacplus-dev/kernel#42) (#40)"
    decided_by: "jodydadescott"
    expires: 2026-12-31
  - id: KSV-0048
    reason: "helm/templates/role.yaml, the schematic-operator Role of the one-namespace layout: the rights the operator needs to apply the generated fleet chart, its deployments, statefulsets and cronjobs rules, and pods get/list/watch/delete (a pod stuck on an old StatefulSet revision, defect #15; the <service>-pigeons and harness-chaos Roles it mints) (#40)"
    decided_by: "jodydadescott"
    expires: 2026-12-31
  - id: KSV-0049
    reason: "helm/templates/role.yaml, the schematic-operator Role of the one-namespace layout: the rights the operator needs to apply the generated fleet chart, its configmaps rule (the services' configs) (#40)"
    decided_by: "jodydadescott"
    expires: 2026-12-31
  - id: KSV-0113
    reason: "helm/templates/role.yaml, the schematic-operator Role of the one-namespace layout: the rights the operator needs to apply the generated fleet chart, its secrets rule (the services' credentials) (#40)"
    decided_by: "jodydadescott"
    expires: 2026-12-31
