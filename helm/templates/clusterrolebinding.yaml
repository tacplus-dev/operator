apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: schematic-operator
  labels:
    {{- include "schematic-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: schematic-operator
subjects:
  - kind: ServiceAccount
    name: schematic-operator
    namespace: {{ .Values.operator.namespace }}
