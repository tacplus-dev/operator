{{- if .Values.registryToken }}
{{- $auth := printf "oauth2:%s" .Values.registryToken | b64enc }}
{{- $config := dict "auths" (dict "registry.gitlab.com" (dict "username" "oauth2" "password" .Values.registryToken "auth" $auth)) | toJson | b64enc }}
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-registry
  namespace: {{ .Values.operator.namespace }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $config }}
{{- end }}
