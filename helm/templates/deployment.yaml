apiVersion: apps/v1
kind: Deployment
metadata:
  name: schematic-operator
  namespace: {{ .Values.operator.namespace }}
  labels:
    {{- include "schematic-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      app: schematic-operator
  template:
    metadata:
      labels:
        app: schematic-operator
        {{- include "schematic-operator.labels" . | nindent 8 }}
    spec:
      serviceAccountName: schematic-operator
      automountServiceAccountToken: false
      tolerations:
      - key: kubernetes.io/arch
        operator: Equal
        value: arm64
        effect: NoSchedule
      {{- include "schematic-operator.imagePullSecrets" . | nindent 6 }}
      containers:
      - name: schematic-operator
        image: {{ .Values.operator.image }}
        imagePullPolicy: {{ .Values.operator.imagePullPolicy }}
        # The uni-config (#17) is the operator's only input: the one Secret the
        # deployment's pipeline applies. The operator expands it into /config,
        # its working directory, at every start, and restarts when the mounted
        # Secret changes.
        args:
        - "--dir=/config"
        - "--uni-config=/etc/schematic/uni-config/uni-config"
        env:
        # The operator holds a kernel identity of its own. Same env var and mount
        # path the generated fleet chart gives every other service
        # (pkg/helm/generator.go withKernelServiceAuth), read by the chassis'
        # kernel client; it goes when the chassis reads the path from config
        # (tacplus-dev/tacplus#262). The reconciler uses this identity to read
        # kernel's tenant records (pkg/bootstrap/kernelconfigstate.go).
        - name: KERNEL_K8S_TOKEN_FILE
          value: /var/run/secrets/schematic/kernel/token
        ports:
        - containerPort: 8080
          name: metrics
        resources:
          {{- toYaml .Values.operator.resources | nindent 10 }}
        volumeMounts:
        - name: kubernetes-api-token
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
        - name: kernel-token
          mountPath: /var/run/secrets/schematic/kernel
          readOnly: true
        - name: uni-config
          mountPath: /etc/schematic/uni-config
          readOnly: true
        - name: config
          mountPath: /config
      volumes:
      - name: kubernetes-api-token
        projected:
          defaultMode: 0444
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
          - downwardAPI:
              items:
              - path: namespace
                fieldRef:
                  fieldPath: metadata.namespace
      - name: kernel-token
        projected:
          defaultMode: 0444
          sources:
          - serviceAccountToken:
              path: token
              audience: schematic-kernel
              expirationSeconds: 3600
      # Applied by the deployment's pipeline, never by this chart: it holds every
      # secret of the deployment, which must not travel in helm values.
      - name: uni-config
        secret:
          secretName: uni-config
          items:
          - key: uni-config
            path: uni-config
      - name: config
        emptyDir: {}
