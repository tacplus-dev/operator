apiVersion: apps/v1
kind: Deployment
metadata:
  name: schematic-operator
  namespace: {{ .Values.operator.namespace }}
  labels:
    {{- include "schematic-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      app: schematic-operator
  template:
    metadata:
      annotations:
        checksum/config-settings: {{ .Values.config.settings | sha256sum | quote }}
        checksum/config-crypto: {{ .Values.config.crypto | sha256sum | quote }}
        checksum/config-bundle: {{ .Values.config.bundle | sha256sum | quote }}
      labels:
        app: schematic-operator
        {{- include "schematic-operator.labels" . | nindent 8 }}
    spec:
      serviceAccountName: schematic-operator
      automountServiceAccountToken: false
      tolerations:
      - key: kubernetes.io/arch
        operator: Equal
        value: arm64
        effect: NoSchedule
      {{- include "schematic-operator.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.config.bundle }}
      initContainers:
      - name: extract-config
        image: busybox:latest
        command:
        - sh
        - -c
        - |
          echo "Extracting config bundle..."
          base64 -d /bundle/config-bundle.tar.gz.b64 | tar -xz -C /config
          chmod -R a+rX /config
          echo "Extracted:"
          find /config/services /config/creds -type f 2>/dev/null | sort
        volumeMounts:
        - name: config-mutable
          mountPath: /config
        - name: config-bundle
          mountPath: /bundle
          readOnly: true
      {{- end }}
      containers:
      - name: schematic-operator
        image: {{ .Values.operator.image }}
        imagePullPolicy: {{ .Values.operator.imagePullPolicy }}
        args:
        - "--dir=/config"
        env:
        - name: SCHEMATIC_OPERATOR_DIR
          value: /config
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # The operator holds a kernel identity of its own. Same env var and mount
        # path the generated fleet chart gives every other service
        # (pkg/helm/generator.go withKernelServiceAuth). BOOTSTRAP_CONFIG is NOT
        # set here: the operator generates its own chassis bootstrap config at
        # runtime from its PKI and topology and points the env var at it. The
        # live opa config push this identity was introduced for was retired
        # 2026-09-24.
        - name: KERNEL_K8S_TOKEN_FILE
          value: /var/run/secrets/schematic/kernel/token
        # Mirrors the SCHEMATIC_LOCAL_IMAGES env var the one-shot `apply` CLI
        # reads from its shell (pkg/helm/generator.go imageRefProj) so the
        # in-cluster reconciler resolves the same image references instead of
        # always falling back to the GitLab registry.
        - name: SCHEMATIC_LOCAL_IMAGES
          value: {{ .Values.operator.localImages | quote }}
        ports:
        - containerPort: 8080
          name: metrics
        resources:
          {{- toYaml .Values.operator.resources | nindent 10 }}
        volumeMounts:
        - name: kubernetes-api-token
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
        - name: kernel-token
          mountPath: /var/run/secrets/schematic/kernel
          readOnly: true
        {{- if .Values.config.bundle }}
        - name: config-mutable
          mountPath: /config
        {{- else }}
        - name: config
          mountPath: /config/operator.yaml
          subPath: operator.yaml
          readOnly: true
        - name: crypto
          mountPath: /config/crypto.yaml
          subPath: crypto.yaml
          readOnly: true
        {{- end }}
        {{- if .Values.config.bundle }}
        # operator.yaml and crypto.yaml overlaid on top of the extracted bundle
        - name: config
          mountPath: /config/operator.yaml
          subPath: operator.yaml
        - name: crypto
          mountPath: /config/crypto.yaml
          subPath: crypto.yaml
        {{- end }}
      volumes:
      - name: kubernetes-api-token
        projected:
          defaultMode: 0444
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
          - downwardAPI:
              items:
              - path: namespace
                fieldRef:
                  fieldPath: metadata.namespace
      - name: kernel-token
        projected:
          defaultMode: 0444
          sources:
          - serviceAccountToken:
              path: token
              audience: schematic-kernel
              expirationSeconds: 3600
      - name: config
        configMap:
          name: schematic-operator-config
      - name: crypto
        secret:
          secretName: schematic-operator-crypto
      {{- if .Values.config.bundle }}
      - name: config-mutable
        emptyDir: {}
      - name: config-bundle
        secret:
          secretName: schematic-operator-bundle
      {{- end }}
