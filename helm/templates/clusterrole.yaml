# Only grants that are genuinely cluster-scoped live here. Everything the
# operator does against the namespaces it manages — deployments, statefulsets,
# services, serviceaccounts, configmaps, secrets, PVCs, namespaced RBAC, leases,
# events — is granted per-namespace by templates/role.yaml instead.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: schematic-operator
  labels:
    {{- include "schematic-operator.labels" . | nindent 4 }}
rules:
  # Read nodes to determine gateway replica count. Nodes are cluster-scoped.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list", "watch"]

  # Helm install runs with CreateNamespace, and the generated service chart
  # carries a Namespace object. Namespaces are cluster-scoped, so this cannot be
  # narrowed to a Role — but the operator never deletes one.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  # The generated service chart emits <service>-tokenreview ClusterRole and
  # ClusterRoleBinding pairs. Cluster-scoped objects, so a Role cannot hold them.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - clusterroles
      - clusterrolebindings
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # RBAC escalation prevention: the operator can only mint the
  # <service>-tokenreview ClusterRole above if it holds this itself.
  # TokenReview is a non-namespaced subresource API.
  - apiGroups: ["authentication.k8s.io"]
    resources:
      - tokenreviews
    verbs: ["create"]

  # Before growing a StatefulSet's PVCs to a bumped volumeClaimTemplates size,
  # the reconciler checks the PVC's StorageClass sets allowVolumeExpansion.
  # StorageClasses are cluster-scoped. The PVCs themselves are namespaced and
  # granted by templates/role.yaml.
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
