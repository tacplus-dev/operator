# ============================================================
# schematic-operator Helm values
# ============================================================

operator:
  image: registry.gitlab.com/secondstarcavalier/schematic/platform/services/operator/schematic-operator:v1.2.28-main.1
  imagePullPolicy: IfNotPresent
  imagePullSecret: gitlab-registry

  # Kubernetes namespace for the operator and all schematic services.
  namespace: schematic

  # Mode: "in-cluster" (default) or "generate-only".
  # Overrides operator.yaml if set here.
  mode: in-cluster

  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 2Gi

# operator.yaml content — topology, FQDN, mode, optional services.
# Populate via: helm install ... --set-file config.settings=./build/operator.yaml
config:
  settings: ""
  # crypto.yaml content (PKI material). Stored as a Secret.
  # Populate via: helm install ... --set-file config.crypto=./build/crypto.yaml
  crypto: ""
  # Base64-encoded tar.gz of the services/ directory.
  # Populate via: just pack  (outputs build/config-bundle.tar.gz.b64)
  # Then: helm install ... --set-string config.bundle=$(cat build/config-bundle.tar.gz.b64)
  bundle: ""

# registryToken, when set, creates a "gitlab-registry" docker-registry Secret in the
# schematic-operator namespace so the operator pod (and auto-upgrade) can pull from
# registry.gitlab.com. Pass via --set registryToken=... at deploy time; never commit here.
registryToken: ""
