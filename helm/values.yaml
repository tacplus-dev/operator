# ============================================================
# schematic-operator Helm values
# ============================================================

operator:
  image: ghcr.io/tacplus-dev/operator:0.1
  imagePullPolicy: IfNotPresent
  imagePullSecret: gitlab-registry

  # Kubernetes namespace for the operator and all schematic services.
  namespace: schematic

  # The deployment this operator runs, when several share the cluster
  # (decisions/deployments-per-cluster-2026-10-26.md). Must match `deployment:`
  # in operator.yaml. When set, the operator runs in tac-<deployment> (and
  # operator.namespace and operator.managedNamespaces are ignored) as the
  # ServiceAccount `operator`, which deploymentproxy's Role and its tenant
  # namespaces' RoleBindings bind by name. The chart then renders no Namespace,
  # ClusterRole, ClusterRoleBinding, Role or RoleBinding: the top pipeline
  # creates tac-<deployment>, and the cluster pipeline grants `operator` admin
  # there and applies deploymentproxy's Role.
  deployment: ""

  # Namespaces the operator deploys the schematic fleet into, when that is not
  # operator.namespace. Must match `namespace:` in operator.yaml. A namespaced
  # Role + RoleBinding is emitted for operator.namespace plus each entry here;
  # the operator holds no workload permissions outside that set.
  managedNamespaces: []

  # Mode: "in-cluster" (default) or "generate-only".
  # Overrides operator.yaml if set here.
  mode: in-cluster

  # Mirrors the SCHEMATIC_LOCAL_IMAGES env var the one-shot `apply` CLI reads
  # from the operator's own shell. The in-cluster reconciler is a long-running
  # pod with no such shell, so it never saw this override — it always fell
  # back to released image references (ghcr.io/tacplus-dev), even on clusters (like this
  # project's GKE cluster) that need a registry prefix such as
  # us-central1-docker.pkg.dev/<project>/cavalier instead. Set here so the
  # value reaches the reconciler's own process environment too.
  localImages: ""

  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 2Gi

# operator.yaml content — topology, FQDN, mode, optional services.
# Populate via: helm install ... --set-file config.settings=./build/operator.yaml
config:
  settings: ""
  # crypto.yaml content (PKI material). Stored as a Secret.
  # Populate via: helm install ... --set-file config.crypto=./build/crypto.yaml
  crypto: ""
  # Base64-encoded tar.gz of the services/ directory.
  # Populate via: just pack  (outputs build/config-bundle.tar.gz.b64)
  # Then: helm install ... --set-string config.bundle=$(cat build/config-bundle.tar.gz.b64)
  bundle: ""
  # images.yaml content: an operator Config carrying only image_digests
  # (scripts/resolve-digests.sh or scripts/promote.sh writes it). Every image it
  # names deploys as <repository>@<digest>, so a new build under the same tag
  # changes the fleet's pod templates and rolls them. Leave empty only on a
  # local cluster that shares the docker daemon (tag-only).
  # Populate via: helm upgrade ... --set-file config.images=./images.yaml
  images: ""

# registryToken, when set, creates a "gitlab-registry" docker-registry Secret in the
# schematic-operator namespace so the operator pod (and auto-upgrade) can pull from
# registry.gitlab.com. Pass via --set registryToken=... at deploy time; never commit here.
registryToken: ""
